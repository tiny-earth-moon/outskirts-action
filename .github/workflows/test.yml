name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan-args:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Argument handling under the system bash
        run: /bin/bash scripts/test-scan-args.sh

  readme-pin:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: README pins the commit of an existing tag
        run: /bin/bash scripts/test-readme-pin.sh

  reports-results:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scan
        uses: ./
        with:
          working-directory: example
          fail-on-results: "false"
          format: xcode
      - name: Unused declaration is reported
        run: |
          cd example
          outskirts scan --format xcode | tee scan.log
          grep -q "unusedHelper" scan.log
      - name: Output version is set
        env:
          VERSION: ${{ steps.scan.outputs.version }}
        run: test -n "$VERSION"

  fails-on-results:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scan
        continue-on-error: true
        uses: ./
        with:
          working-directory: example
      - name: Step failed because of results
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: test "$OUTCOME" = "failure"

  pinned-version:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scan
        uses: ./
        with:
          version: v3.20.0
          working-directory: example
          fail-on-results: "false"
      - name: Pinned version installed
        env:
          VERSION: ${{ steps.scan.outputs.version }}
        run: |
          test "$VERSION" = "3.20.0"
          outskirts version | grep -q "3.20.0"

  attested-version:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scan
        uses: ./
        with:
          version: 3.23.0
          working-directory: example
          fail-on-results: "false"
      - name: Attested version installed
        env:
          VERSION: ${{ steps.scan.outputs.version }}
        run: test "$VERSION" = "3.23.0"
